<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porter Dispatch MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="md:col-span-1 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Porter Status <span id="porter-count" class="text-base font-normal text-gray-500"></span></h2>
            <div id="porter-status-list" class="space-y-4">
                <p class="text-gray-500">Loading...</p>
            </div>
            <button id="refresh-status-btn" class="mt-4 w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">
                Refresh Status
            </button>
        </div>
        
        <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold mb-6">Porter Dispatch Prototype</h1>
            
            <div class="space-y-4">
                <div>
                    <label for="task-input" class="block text-sm font-medium text-gray-700">New Task Request (Natural Language)</label>
                    <textarea id="task-input" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>
                
                <div class="flex gap-2">
                    <button id="dispatch-btn" class="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-green-700">
                        Dispatch Task
                    </button>
                    <button id="undo-btn" class="bg-yellow-500 text-white py-2 px-4 rounded-lg font-medium hover:bg-yellow-600 hidden">
                        Undo
                    </button>
                </div>
                
                <div class="pt-4">
                    <h3 class="text-lg font-medium">Quick Tasks (Examples)</h3>
                    <div class="flex flex-wrap gap-2 mt-2">
                        <button class="quick-task bg-gray-200 p-2 rounded-lg text-sm hover:bg-gray-300">urgent patient 7H to 3FXRAY</button>
                        <button class="quick-task bg-gray-200 p-2 rounded-lg text-sm hover:bg-gray-300">specimen from lab to A&D</button>
                        <button class="quick-task bg-gray-200 p-2 rounded-lg text-sm hover:bg-gray-300">body from 6H to mortuary, immediate</button>
                    </div>
                </div>
            </div>
            
            <div id="response-area" class="mt-6 p-4 bg-gray-50 rounded-lg border hidden">
                <h3 class="text-lg font-medium text-gray-900 mb-2" id="response-title">Dispatch Result</h3>
                <div id="assignments-container" class="space-y-3"></div>
                <pre id="response-json" class="text-sm bg-gray-900 text-white p-4 rounded-md overflow-x-auto mt-3"></pre>
            </div>
        </div>
        
    </div>

    <!-- Scheduled Tasks Panel -->
    <div class="max-w-4xl mx-auto mt-8 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 border-b pb-2">Scheduled Tasks <span id="scheduled-count" class="text-base font-normal text-gray-500"></span></h2>
        <div id="scheduled-list" class="space-y-2">
            <p class="text-gray-400 text-sm">No scheduled tasks.</p>
        </div>
    </div>

    <!-- Advisor Panel -->
    <div class="max-w-4xl mx-auto mt-8 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 border-b pb-2">Policy Advisor</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <button id="get-suggestions-btn" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 mb-3">
                    Get Policy Suggestions
                </button>
                <div id="suggestions-area" class="p-3 bg-purple-50 border border-purple-200 rounded-md text-sm hidden">
                    <div id="suggestions-content"></div>
                </div>
            </div>
            <div>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="advisor-question" placeholder="Ask about operations..."
                           class="flex-1 p-2 border border-gray-300 rounded-md text-sm">
                    <button id="ask-advisor-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm">
                        Ask
                    </button>
                </div>
                <div id="advisor-answer-area" class="p-3 bg-indigo-50 border border-indigo-200 rounded-md text-sm hidden">
                    <p id="advisor-answer"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('task-input');
            const dispatchBtn = document.getElementById('dispatch-btn');
            const undoBtn = document.getElementById('undo-btn');
            const responseArea = document.getElementById('response-area');
            const responseTitle = document.getElementById('response-title');
            const responseJson = document.getElementById('response-json');
            const quickTaskBtns = document.querySelectorAll('.quick-task');
            const statusList = document.getElementById('porter-status-list');
            const refreshBtn = document.getElementById('refresh-status-btn');

            // --- Status Fetching Logic ---
            const fetchStatus = async () => {
                try {
                    statusList.innerHTML = '<p class="text-gray-500">Loading...</p>';
                    
                    const response = await fetch('/status');
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    
                    statusList.innerHTML = ''; // Clear current list

                    const porterCountEl = document.getElementById('porter-count');
                    if (porterCountEl && data.total_porters) {
                        porterCountEl.textContent = `(${data.total_porters})`;
                    }

                    data.porters.forEach(porter => {
                        const isAvailable = porter.status === 'available';
                        const statusColor = isAvailable ? 'text-green-600' : 'text-red-600';
                        const bgColor = isAvailable ? 'bg-green-50' : 'bg-red-50';

                        const porterEl = document.createElement('div');
                        porterEl.className = `p-3 rounded-lg border ${bgColor}`;

                        porterEl.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-lg">${porter.id}</span>
                                <span class="font-medium ${statusColor}">${porter.status.toUpperCase()}</span>
                            </div>
                            <div class="text-sm text-gray-600">Location: ${porter.location}</div>
                            <div class="text-sm text-gray-600">Task: ${porter.task}</div>
                            ${porter.route ? `<div class="text-sm text-indigo-700 font-mono mt-1">${porter.route}</div>` : ''}
                            ${!isAvailable ? `<button class="complete-task-btn mt-2 w-full bg-yellow-500 text-white py-1 px-2 rounded text-sm hover:bg-yellow-600" data-porter-id="${porter.id}">Complete Task</button>` : ''}
                        `;
                        statusList.appendChild(porterEl);
                    });

                    // Update queue length
                    const queueEl = document.createElement('div');
                    queueEl.className = 'mt-4 pt-4 border-t';
                    queueEl.innerHTML = `
                        <div class="font-bold text-lg">Task Queue</div>
                        <div class="text-gray-700">Pending Tasks: ${data.queue_length}</div>
                    `;
                    statusList.appendChild(queueEl);

                } catch (error) {
                    console.error('Error fetching status:', error);
                    statusList.innerHTML = '<p class="text-red-500">Error loading status.</p>';
                }

                // Attach event listeners to "Complete Task" buttons
                document.querySelectorAll('.complete-task-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const porterId = e.target.getAttribute('data-porter-id');
                        try {
                            const response = await fetch(`/complete/${porterId}`, { method: 'POST' });
                            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                            console.log(`[UI] Task completed for ${porterId}`);
                            fetchStatus(); // Refresh status immediately
                        } catch (error) {
                            console.error('Error completing task:', error);
                            alert(`Failed to complete task for ${porterId}`);
                        }
                    });
                });
            };
            
            // --- Dispatch Logic ---
            const handleDispatch = async () => {
                const requestText = taskInput.value;
                if (!requestText) {
                    alert('Please enter a task request.');
                    return;
                }
                
                dispatchBtn.disabled = true;
                dispatchBtn.textContent = 'Dispatching...';
                responseArea.classList.add('hidden');
                
                try {
                    const response = await fetch('/dispatch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ request: requestText })
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();

                    const assigned = data.assignments || [];
                    const queued = data.queued || 0;
                    const errors = data.errors || [];
                    const titleParts = [];
                    if (assigned.length) titleParts.push(`${assigned.length} assigned`);
                    if (queued) titleParts.push(`${queued} queued`);
                    if (errors.length) titleParts.push(`${errors.length} error(s)`);
                    responseTitle.textContent = `Result: ${titleParts.join(', ') || 'No tasks'}`;

                    const container = document.getElementById('assignments-container');
                    container.innerHTML = '';

                    // Error cards — shown when the LLM returned unrecognised locations/services
                    errors.forEach(errMsg => {
                        const errCard = document.createElement('div');
                        errCard.className = 'p-3 rounded-lg border border-orange-400 bg-orange-50';
                        errCard.innerHTML = `
                            <div class="font-semibold text-orange-800">Could not dispatch task</div>
                            <div class="text-sm text-orange-700 mt-1">${errMsg}</div>
                            <div class="text-xs text-orange-500 mt-1">Try rephrasing with exact location names (e.g. "7H", "A&D", "3FXRAY").</div>
                        `;
                        container.appendChild(errCard);
                    });

                    const scheduledItems = data.scheduled || [];
                    scheduledItems.forEach(s => {
                        const card = document.createElement('div');
                        card.className = 'p-3 rounded-lg border border-blue-300 bg-blue-50';
                        const at = new Date(s.scheduled_at);
                        card.innerHTML = `
                            <div class="font-semibold text-blue-800">Scheduled — ${s.task ? s.task.service : ''} <span class="text-xs font-mono text-blue-500">#${s.id}</span></div>
                            <div class="text-sm text-gray-600">${s.task ? s.task.from : ''} → ${s.task ? s.task.to : ''}</div>
                            <div class="text-sm text-blue-700">Releases at ${at.toLocaleTimeString()}</div>
                        `;
                        container.appendChild(card);
                    });

                    assigned.forEach(a => {
                        const stops = (a.task && a.task.stops && a.task.stops.length)
                            ? `<div class="text-sm text-gray-600">Stops: ${a.task.stops.join(' → ')}</div>` : '';
                        const card = document.createElement('div');
                        card.className = 'p-3 rounded-lg border border-green-300 bg-green-50';
                        card.innerHTML = `
                            <div class="font-semibold text-green-800">${a.porter_id} — ${a.task ? a.task.service : ''}</div>
                            <div class="text-sm text-gray-600">${a.task ? a.task.from : ''} → ${a.task ? a.task.to : ''} (${a.estimated_duration_mins} min)</div>
                            ${stops}
                            ${a.explanation ? `<div class="mt-1 text-sm text-blue-800 bg-blue-50 border border-blue-200 rounded p-2"><span class="font-semibold">Why?</span> ${a.explanation}</div>` : ''}
                        `;
                        container.appendChild(card);
                    });
                    if (queued > 0) {
                        const qCard = document.createElement('div');
                        qCard.className = 'p-3 rounded-lg border border-red-300 bg-red-50 text-sm text-red-800';
                        qCard.textContent = `${queued} task(s) queued — all porters busy.`;
                        container.appendChild(qCard);
                    }

                    responseJson.textContent = JSON.stringify(data, null, 2);
                    responseArea.classList.remove('hidden');
                    responseArea.classList.remove('border-red-300', 'bg-red-50', 'border-green-300', 'bg-green-50');
                    responseArea.classList.add(assigned.length ? 'border-green-300' : 'border-red-300');

                    // Show undo button only when something was actually dispatched
                    if (assigned.length > 0 || queued > 0) {
                        undoBtn.classList.remove('hidden');
                    } else {
                        undoBtn.classList.add('hidden');
                    }

                    // Refresh status after dispatch
                    fetchStatus();

                } catch (error) {
                    console.error('Error dispatching task:', error);
                    responseTitle.textContent = 'Error';
                    responseJson.textContent = error.toString();
                    responseArea.classList.remove('hidden');
                    responseArea.classList.add('border-red-300', 'bg-red-50');
                } finally {
                    dispatchBtn.disabled = false;
                    dispatchBtn.textContent = 'Dispatch Task';
                }
            };

            dispatchBtn.addEventListener('click', handleDispatch);
            refreshBtn.addEventListener('click', fetchStatus);

            undoBtn.addEventListener('click', async () => {
                undoBtn.disabled = true;
                undoBtn.textContent = 'Undoing...';
                try {
                    const resp = await fetch('/undo', { method: 'POST' });
                    if (!resp.ok) {
                        const text = await resp.text();
                        throw new Error(`Server returned ${resp.status}: ${text.slice(0, 200)}`);
                    }
                    const data = await resp.json();
                    responseTitle.textContent = data.message || 'Undo complete';
                    document.getElementById('assignments-container').innerHTML = '';
                    responseJson.textContent = JSON.stringify(data, null, 2);
                } catch (err) {
                    responseTitle.textContent = `Undo failed: ${err}`;
                } finally {
                    undoBtn.classList.add('hidden');
                    undoBtn.disabled = false;
                    undoBtn.textContent = 'Undo';
                    fetchStatus();
                }
            });
            
            quickTaskBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    taskInput.value = e.target.textContent;
                    handleDispatch(); // Auto-dispatch on click
                });
            });
            
            // --- Advisor Logic ---
            const suggestionsBtn = document.getElementById('get-suggestions-btn');
            const suggestionsArea = document.getElementById('suggestions-area');
            const suggestionsContent = document.getElementById('suggestions-content');
            const askAdvisorBtn = document.getElementById('ask-advisor-btn');
            const advisorQuestion = document.getElementById('advisor-question');
            const advisorAnswerArea = document.getElementById('advisor-answer-area');
            const advisorAnswer = document.getElementById('advisor-answer');

            suggestionsBtn.addEventListener('click', async () => {
                suggestionsBtn.textContent = 'Loading...';
                suggestionsBtn.disabled = true;
                try {
                    const resp = await fetch('/advisor/suggestions');
                    const data = await resp.json();
                    let html = '<p class="font-semibold mb-2">Performance Summary</p>';
                    if (data.performance) {
                        const p = data.performance;
                        html += `<p>Tasks: ${p.total_tasks} | Mean: ${p.mean_duration} min | KPI violations: ${p.kpi_violation_rate}%</p>`;
                    }
                    if (data.suggestions && data.suggestions.length > 0) {
                        html += '<p class="font-semibold mt-3 mb-1">Suggestions</p><ul class="list-disc pl-5 space-y-1">';
                        data.suggestions.forEach(s => { html += `<li>${s}</li>`; });
                        html += '</ul>';
                    }
                    suggestionsContent.innerHTML = html;
                    suggestionsArea.classList.remove('hidden');
                } catch (err) {
                    suggestionsContent.innerHTML = `<p class="text-red-500">Error: ${err}</p>`;
                    suggestionsArea.classList.remove('hidden');
                } finally {
                    suggestionsBtn.textContent = 'Get Policy Suggestions';
                    suggestionsBtn.disabled = false;
                }
            });

            askAdvisorBtn.addEventListener('click', async () => {
                const q = advisorQuestion.value.trim();
                if (!q) return;
                askAdvisorBtn.textContent = '...';
                askAdvisorBtn.disabled = true;
                try {
                    const resp = await fetch('/advisor/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: q })
                    });
                    const data = await resp.json();
                    advisorAnswer.textContent = data.answer || JSON.stringify(data);
                    advisorAnswerArea.classList.remove('hidden');
                } catch (err) {
                    advisorAnswer.textContent = `Error: ${err}`;
                    advisorAnswerArea.classList.remove('hidden');
                } finally {
                    askAdvisorBtn.textContent = 'Ask';
                    askAdvisorBtn.disabled = false;
                }
            });

            advisorQuestion.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') askAdvisorBtn.click();
            });

            // --- Scheduled Tasks Panel ---
            const scheduledList = document.getElementById('scheduled-list');
            const scheduledCount = document.getElementById('scheduled-count');

            const fetchScheduled = async () => {
                try {
                    const resp = await fetch('/scheduled');
                    if (!resp.ok) return;
                    const data = await resp.json();
                    const tasks = data.scheduled_tasks || [];
                    scheduledCount.textContent = tasks.length ? `(${tasks.length})` : '';
                    if (tasks.length === 0) {
                        scheduledList.innerHTML = '<p class="text-gray-400 text-sm">No scheduled tasks.</p>';
                        return;
                    }
                    scheduledList.innerHTML = '';
                    tasks.forEach(entry => {
                        const at = new Date(entry.scheduled_at);
                        const mins = Math.floor(entry.seconds_until / 60);
                        const secs = entry.seconds_until % 60;
                        const countdown = entry.seconds_until > 0
                            ? `in ${mins}m ${secs}s`
                            : 'releasing soon…';
                        const el = document.createElement('div');
                        el.className = 'flex items-center justify-between p-3 rounded-lg border border-blue-200 bg-blue-50';
                        el.innerHTML = `
                            <div>
                                <span class="font-semibold text-blue-800">${entry.task ? entry.task.service : '—'}</span>
                                <span class="text-xs font-mono text-blue-400 ml-2">#${entry.id}</span>
                                <div class="text-sm text-gray-600">${entry.task ? entry.task.from : ''} → ${entry.task ? entry.task.to : ''}</div>
                                <div class="text-sm text-blue-700">${at.toLocaleTimeString()} <span class="text-gray-500">(${countdown})</span></div>
                            </div>
                            <button class="cancel-scheduled-btn ml-4 bg-red-100 text-red-700 px-3 py-1 rounded text-sm hover:bg-red-200" data-entry-id="${entry.id}">Cancel</button>
                        `;
                        scheduledList.appendChild(el);
                    });

                    document.querySelectorAll('.cancel-scheduled-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const entryId = e.target.getAttribute('data-entry-id');
                            try {
                                await fetch(`/scheduled/${entryId}`, { method: 'DELETE' });
                                fetchScheduled();
                            } catch (err) {
                                alert(`Failed to cancel: ${err}`);
                            }
                        });
                    });
                } catch (err) {
                    console.error('Error fetching scheduled tasks:', err);
                }
            };

            // Poll scheduled tasks every 10 seconds for countdown updates
            fetchScheduled();
            setInterval(fetchScheduled, 10000);

            // Initial load
            fetchStatus();
        });
    </script>
</body>
</html>
