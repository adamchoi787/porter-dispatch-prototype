<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porter Dispatch MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="md:col-span-1 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Porter Status</h2>
            <div id="porter-status-list" class="space-y-4">
                <p class="text-gray-500">Loading...</p>
            </div>
            <button id="refresh-status-btn" class="mt-4 w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">
                Refresh Status
            </button>
        </div>
        
        <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold mb-6">Porter Dispatch Prototype</h1>
            
            <div class="space-y-4">
                <div>
                    <label for="task-input" class="block text-sm font-medium text-gray-700">New Task Request (Natural Language)</label>
                    <textarea id="task-input" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>
                
                <button id="dispatch-btn" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-green-700">
                    Dispatch Task
                </button>
                
                <div class="pt-4">
                    <h3 class="text-lg font-medium">Quick Tasks (Examples)</h3>
                    <div class="flex flex-wrap gap-2 mt-2">
                        <button class="quick-task bg-gray-200 p-2 rounded-lg text-sm hover:bg-gray-300">urgent patient 7H to 3FXRAY</button>
                        <button class="quick-task bg-gray-200 p-2 rounded-lg text-sm hover:bg-gray-300">specimen from lab to A&D</button>
                        <button class="quick-task bg-gray-200 p-2 rounded-lg text-sm hover:bg-gray-300">body from 6H to mortuary, immediate</button>
                    </div>
                </div>
            </div>
            
            <div id="response-area" class="mt-6 p-4 bg-gray-50 rounded-lg border hidden">
                <h3 class="text-lg font-medium text-gray-900 mb-2" id="response-title">Dispatch Result</h3>
                <div id="explanation-area" class="mb-3 p-3 bg-blue-50 border border-blue-200 rounded-md text-sm text-blue-900 hidden">
                    <span class="font-semibold">Why this porter?</span>
                    <p id="explanation-text" class="mt-1"></p>
                </div>
                <pre id="response-json" class="text-sm bg-gray-900 text-white p-4 rounded-md overflow-x-auto"></pre>
            </div>
        </div>
        
    </div>

    <!-- Advisor Panel -->
    <div class="max-w-4xl mx-auto mt-8 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 border-b pb-2">Policy Advisor</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <button id="get-suggestions-btn" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 mb-3">
                    Get Policy Suggestions
                </button>
                <div id="suggestions-area" class="p-3 bg-purple-50 border border-purple-200 rounded-md text-sm hidden">
                    <div id="suggestions-content"></div>
                </div>
            </div>
            <div>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="advisor-question" placeholder="Ask about operations..."
                           class="flex-1 p-2 border border-gray-300 rounded-md text-sm">
                    <button id="ask-advisor-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm">
                        Ask
                    </button>
                </div>
                <div id="advisor-answer-area" class="p-3 bg-indigo-50 border border-indigo-200 rounded-md text-sm hidden">
                    <p id="advisor-answer"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('task-input');
            const dispatchBtn = document.getElementById('dispatch-btn');
            const responseArea = document.getElementById('response-area');
            const responseTitle = document.getElementById('response-title');
            const responseJson = document.getElementById('response-json');
            const quickTaskBtns = document.querySelectorAll('.quick-task');
            const statusList = document.getElementById('porter-status-list');
            const refreshBtn = document.getElementById('refresh-status-btn');

            // --- Status Fetching Logic ---
            const fetchStatus = async () => {
                try {
                    statusList.innerHTML = '<p class="text-gray-500">Loading...</p>';
                    
                    const response = await fetch('/status');
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    
                    statusList.innerHTML = ''; // Clear current list
                    
                    data.porters.forEach(porter => {
                        const isAvailable = porter.status === 'available';
                        const statusColor = isAvailable ? 'text-green-600' : 'text-red-600';
                        const bgColor = isAvailable ? 'bg-green-50' : 'bg-red-50';

                        const porterEl = document.createElement('div');
                        porterEl.className = `p-3 rounded-lg border ${bgColor}`;

                        porterEl.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-lg">${porter.id}</span>
                                <span class="font-medium ${statusColor}">${porter.status.toUpperCase()}</span>
                            </div>
                            <div class="text-sm text-gray-600">Location: ${porter.location}</div>
                            <div class="text-sm text-gray-600">Task: ${porter.task}</div>
                            ${!isAvailable ? `<button class="complete-task-btn mt-2 w-full bg-yellow-500 text-white py-1 px-2 rounded text-sm hover:bg-yellow-600" data-porter-id="${porter.id}">Complete Task</button>` : ''}
                        `;
                        statusList.appendChild(porterEl);
                    });

                    // Update queue length
                    const queueEl = document.createElement('div');
                    queueEl.className = 'mt-4 pt-4 border-t';
                    queueEl.innerHTML = `
                        <div class="font-bold text-lg">Task Queue</div>
                        <div class="text-gray-700">Pending Tasks: ${data.queue_length}</div>
                    `;
                    statusList.appendChild(queueEl);

                } catch (error) {
                    console.error('Error fetching status:', error);
                    statusList.innerHTML = '<p class="text-red-500">Error loading status.</p>';
                }

                // Attach event listeners to "Complete Task" buttons
                document.querySelectorAll('.complete-task-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const porterId = e.target.getAttribute('data-porter-id');
                        try {
                            const response = await fetch(`/complete/${porterId}`, { method: 'POST' });
                            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                            console.log(`[UI] Task completed for ${porterId}`);
                            fetchStatus(); // Refresh status immediately
                        } catch (error) {
                            console.error('Error completing task:', error);
                            alert(`Failed to complete task for ${porterId}`);
                        }
                    });
                });
            };
            
            // --- Dispatch Logic ---
            const handleDispatch = async () => {
                const requestText = taskInput.value;
                if (!requestText) {
                    alert('Please enter a task request.');
                    return;
                }
                
                dispatchBtn.disabled = true;
                dispatchBtn.textContent = 'Dispatching...';
                responseArea.classList.add('hidden');
                
                try {
                    const response = await fetch('/dispatch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ request: requestText })
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    
                    responseTitle.textContent = `Result: ${data.status}`;
                    responseJson.textContent = JSON.stringify(data, null, 2);
                    responseArea.classList.remove('hidden');

                    // Show LLM explanation if available
                    const explArea = document.getElementById('explanation-area');
                    const explText = document.getElementById('explanation-text');
                    if (data.explanation) {
                        explText.textContent = data.explanation;
                        explArea.classList.remove('hidden');
                    } else {
                        explArea.classList.add('hidden');
                    }

                    if(data.status === "Task Assigned") {
                        responseArea.classList.remove('border-red-300', 'bg-red-50');
                        responseArea.classList.add('border-green-300', 'bg-green-50');
                    } else {
                        responseArea.classList.remove('border-green-300', 'bg-green-50');
                        responseArea.classList.add('border-red-300', 'bg-red-50');
                    }
                    
                    // Refresh status after dispatch
                    fetchStatus();

                } catch (error) {
                    console.error('Error dispatching task:', error);
                    responseTitle.textContent = 'Error';
                    responseJson.textContent = error.toString();
                    responseArea.classList.remove('hidden');
                    responseArea.classList.add('border-red-300', 'bg-red-50');
                } finally {
                    dispatchBtn.disabled = false;
                    dispatchBtn.textContent = 'Dispatch Task';
                }
            };

            dispatchBtn.addEventListener('click', handleDispatch);
            refreshBtn.addEventListener('click', fetchStatus);
            
            quickTaskBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    taskInput.value = e.target.textContent;
                    handleDispatch(); // Auto-dispatch on click
                });
            });
            
            // --- Advisor Logic ---
            const suggestionsBtn = document.getElementById('get-suggestions-btn');
            const suggestionsArea = document.getElementById('suggestions-area');
            const suggestionsContent = document.getElementById('suggestions-content');
            const askAdvisorBtn = document.getElementById('ask-advisor-btn');
            const advisorQuestion = document.getElementById('advisor-question');
            const advisorAnswerArea = document.getElementById('advisor-answer-area');
            const advisorAnswer = document.getElementById('advisor-answer');

            suggestionsBtn.addEventListener('click', async () => {
                suggestionsBtn.textContent = 'Loading...';
                suggestionsBtn.disabled = true;
                try {
                    const resp = await fetch('/advisor/suggestions');
                    const data = await resp.json();
                    let html = '<p class="font-semibold mb-2">Performance Summary</p>';
                    if (data.performance) {
                        const p = data.performance;
                        html += `<p>Tasks: ${p.total_tasks} | Mean: ${p.mean_duration} min | KPI violations: ${p.kpi_violation_rate}%</p>`;
                    }
                    if (data.suggestions && data.suggestions.length > 0) {
                        html += '<p class="font-semibold mt-3 mb-1">Suggestions</p><ul class="list-disc pl-5 space-y-1">';
                        data.suggestions.forEach(s => { html += `<li>${s}</li>`; });
                        html += '</ul>';
                    }
                    suggestionsContent.innerHTML = html;
                    suggestionsArea.classList.remove('hidden');
                } catch (err) {
                    suggestionsContent.innerHTML = `<p class="text-red-500">Error: ${err}</p>`;
                    suggestionsArea.classList.remove('hidden');
                } finally {
                    suggestionsBtn.textContent = 'Get Policy Suggestions';
                    suggestionsBtn.disabled = false;
                }
            });

            askAdvisorBtn.addEventListener('click', async () => {
                const q = advisorQuestion.value.trim();
                if (!q) return;
                askAdvisorBtn.textContent = '...';
                askAdvisorBtn.disabled = true;
                try {
                    const resp = await fetch('/advisor/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: q })
                    });
                    const data = await resp.json();
                    advisorAnswer.textContent = data.answer || JSON.stringify(data);
                    advisorAnswerArea.classList.remove('hidden');
                } catch (err) {
                    advisorAnswer.textContent = `Error: ${err}`;
                    advisorAnswerArea.classList.remove('hidden');
                } finally {
                    askAdvisorBtn.textContent = 'Ask';
                    askAdvisorBtn.disabled = false;
                }
            });

            advisorQuestion.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') askAdvisorBtn.click();
            });

            // Initial load
            fetchStatus();
        });
    </script>
</body>
</html>
